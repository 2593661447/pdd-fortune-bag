<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼多多福袋分享平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff3b30;
            --primary-dark: #e62e24;
            --secondary: #ff9500;
            --secondary-dark: #e68500;
            --success: #34c759;
            --warning: #ff9500;
            --danger: #ff3b30;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-tertiary: #a1a1a6;
            --surface-primary: #ffffff;
            --surface-secondary: #f5f5f7;
            --surface-tertiary: #e5e5ea;
            --border: #d1d1d6;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --text-tertiary: #6e6e73;
                --surface-primary: #1d1d1f;
                --surface-secondary: #2c2c2e;
                --surface-tertiary: #3a3a3c;
                --border: #48484a;
                --shadow: 0 4px 20px rgba(0,0,0,0.3);
                --shadow-hover: 0 8px 30px rgba(0,0,0,0.4);
            }
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff9f0 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); }
        }
        .container { max-width:1200px; margin:0 auto; padding:var(--spacing-lg); }
        .header { text-align:center; margin-bottom:var(--spacing-2xl); padding-top:var(--spacing-xl); }
        .logo { display:flex; align-items:center; justify-content:center; gap:var(--spacing-sm); margin-bottom:var(--spacing-md); }
        .logo-icon { color:var(--primary); font-size:2.5rem; }
        .logo-text {
            font-size:2.5rem; font-weight:700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .tagline { color:var(--text-secondary); font-size:1.1rem; max-width:600px; margin:0 auto; }

        .publish-section, .shares-section {
            background:var(--surface-primary); border-radius:var(--radius-lg);
            padding:var(--spacing-xl); box-shadow:var(--shadow);
            margin-bottom:var(--spacing-2xl); border:1px solid var(--border);
        }
        .section-title { font-size:1.5rem; font-weight:600; margin-bottom:var(--spacing-lg); display:flex; align-items:center; gap:var(--spacing-sm); }
        .section-title i { color:var(--primary); }
        .input-group { display:flex; gap:var(--spacing-md); margin-bottom:var(--spacing-md); }
        @media (max-width:768px) { .input-group { flex-direction:column; } }
        .share-input {
            flex:1; padding:var(--spacing-lg); border:2px solid var(--border);
            border-radius:var(--radius-md); font-size:1.1rem;
            background:var(--surface-primary); color:var(--text-primary);
            transition:all 0.2s ease;
        }
        .share-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(255,59,48,0.1); }
        .share-input::placeholder { color:var(--text-tertiary); }
        .publish-btn {
            padding:var(--spacing-lg) var(--spacing-xl);
            background:var(--primary); color:white; border:none; border-radius:var(--radius-md);
            font-size:1.1rem; font-weight:600; cursor:pointer;
            transition:all 0.2s ease; white-space:nowrap;
        }
        .publish-btn:hover:not(:disabled) { background:var(--primary-dark); transform:translateY(-2px); box-shadow:0 6px 20px rgba(255,59,48,0.3); }
        .publish-btn:disabled { opacity:0.6; cursor:not-allowed; }
        .hint { color:var(--text-secondary); font-size:0.9rem; }
        .shares-list { display:grid; gap:var(--spacing-md); }
        .share-item {
            background:var(--surface-secondary); border-radius:var(--radius-md);
            padding:var(--spacing-lg); border:1px solid var(--border);
            display:flex; justify-content:space-between; align-items:center; gap:var(--spacing-md);
        }
        @media (max-width:768px) { .share-item { flex-direction:column; align-items:flex-start; } }
        .share-code { font-family:'Courier New', monospace; font-size:1.3rem; font-weight:600; word-break:break-all; }
        .share-meta { color:var(--text-secondary); font-size:0.9rem; margin-top:var(--spacing-xs); }
        .status-pending { color:var(--warning); font-weight:500; }
        .status-copied { color:var(--success); font-weight:500; }
        .status-expired { color:var(--text-tertiary); font-weight:500; }
        .copy-btn {
            padding:var(--spacing-md) var(--spacing-lg);
            background:var(--secondary); color:white; border:none; border-radius:var(--radius-sm);
            font-weight:600; cursor:pointer; white-space:nowrap;
            transition:all 0.2s ease;
        }
        .copy-btn:hover:not(:disabled) { background:var(--secondary-dark); transform:translateY(-2px); }
        .copy-btn:disabled { background:var(--surface-tertiary); color:var(--text-tertiary); cursor:not-allowed; }
        .copy-btn.copied { background:var(--success); }
        .empty-state { text-align:center; padding:var(--spacing-2xl); color:var(--text-tertiary); }
        .empty-state i { font-size:4rem; margin-bottom:var(--spacing-lg); opacity:0.5; }
        .footer { text-align:center; margin-top:var(--spacing-2xl); padding:var(--spacing-xl) 0; color:var(--text-secondary); font-size:0.9rem; border-top:1px solid var(--border); }
        .connection-bar {
            text-align:center; padding:var(--spacing-md); border-radius:var(--radius-md);
            margin-bottom:var(--spacing-lg); font-weight:500;
        }
        .connection-ok { background:rgba(52,199,89,0.1); color:var(--success); }
        .connection-err { background:rgba(255,59,48,0.1); color:var(--danger); }
        .toast {
            position:fixed; bottom:var(--spacing-xl); right:var(--spacing-xl);
            background:var(--surface-primary); padding:var(--spacing-lg) var(--spacing-xl);
            border-radius:var(--radius-md); box-shadow:var(--shadow-hover);
            border-left:4px solid var(--success); z-index:1000; max-width:400px;
            transition:all 0.3s ease; opacity:0; transform:translateY(100px);
        }
        .toast.show { opacity:1; transform:translateY(0); }
        .toast.error { border-left-color:var(--danger); }
        @media (max-width:768px) { .toast { left:var(--spacing-md); right:var(--spacing-md); max-width:none; } }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-gift logo-icon"></i>
                <h1 class="logo-text">拼多多福袋分享</h1>
            </div>
            <p class="tagline">分享你的福袋，每个分享码仅限一人复制，24小时内有效</p>
        </header>

        <div class="connection-bar connection-err" id="connBar">连接中...</div>

        <section class="publish-section">
            <h2 class="section-title"><i class="fas fa-plus-circle"></i>发布新分享码</h2>
            <div class="input-group">
                <input type="text" class="share-input" id="shareInput" placeholder="输入拼多多福袋分享码" maxlength="50">
                <button class="publish-btn" id="publishBtn">发布</button>
            </div>
            <p class="hint">分享码发布后24小时内有效，仅限一人复制</p>
        </section>

        <section class="shares-section">
            <h2 class="section-title"><i class="fas fa-list"></i>当前分享码列表</h2>
            <div id="sharesList">
                <div class="empty-state"><i class="fas fa-inbox"></i><p>暂无分享码</p></div>
            </div>
        </section>

        <footer class="footer">
            <p>拼多多福袋分享平台 | 实时同步，多人共享 | 2025</p>
        </footer>
    </div>

    <div class="toast" id="toast"><span id="toastMsg"></span></div>

    <!-- Firebase Compat SDK (namespaced) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCWVH_Bt_gYKFa9KqxyNRaqNtNooqOmuhk",
            authDomain: "pdd-fortune-bag.firebaseapp.com",
            databaseURL: "https://pdd-fortune-bag-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pdd-fortune-bag",
            storageBucket: "pdd-fortune-bag.firebasestorage.app",
            messagingSenderId: "1076733344090",
            appId: "1:1076733344090:web:23ea8f1d399689dbf95b63"
        };

        const connBar = document.getElementById('connBar');
        const shareInput = document.getElementById('shareInput');
        const publishBtn = document.getElementById('publishBtn');
        const sharesList = document.getElementById('sharesList');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        let allShares = [];

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const sharesRef = db.ref('shares');

        // 连接状态
        db.ref('.info/connected').on('value', function(snap) {
            if (snap.val() === true) {
                connBar.className = 'connection-bar connection-ok';
                connBar.textContent = '已连接 - 实时同步中';
            } else {
                connBar.className = 'connection-bar connection-err';
                connBar.textContent = '连接断开，正在重连...';
            }
        });

        // 监听数据
        sharesRef.on('value', function(snapshot) {
            const data = snapshot.val();
            allShares = data ? Object.entries(data).map(([id, val]) => ({ id, ...val })) : [];
            checkExpired();
            render();
        }, function(err) {
            console.error('读取失败:', err);
            connBar.className = 'connection-bar connection-err';
            connBar.textContent = '数据读取失败: ' + err.message;
        });

        function checkExpired() {
            const now = Date.now();
            var updates = {};
            allShares.forEach(function(s) {
                if (s.status === 'pending' && s.expiresAt <= now) {
                    updates[s.id + '/status'] = 'expired';
                }
            });
            if (Object.keys(updates).length > 0) db.ref('shares').update(updates);
        }

        function render() {
            var today = new Date().toISOString().split('T')[0];
            var todayShares = allShares.filter(function(s) {
                return new Date(s.createdAt).toISOString().split('T')[0] === today && s.status !== 'expired';
            });

            if (todayShares.length === 0) {
                sharesList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>暂无分享码</p></div>';
                return;
            }

            todayShares.sort(function(a, b) { return b.createdAt - a.createdAt; });

            var html = '<div class="shares-list">';
            todayShares.forEach(function(s) {
                var expiresAt = new Date(s.expiresAt);
                var timeLeft = expiresAt - Date.now();
                var hoursLeft = Math.floor(timeLeft / 3600000);
                var minsLeft = Math.floor((timeLeft % 3600000) / 60000);
                var timeStr = timeLeft > 0 ? hoursLeft + 'h' + minsLeft + 'm后过期' : '已过期';
                var statusHtml = s.status === 'pending' ? '<span class="status-pending">待复制</span>'
                    : s.status === 'copied' ? '<span class="status-copied">已复制</span>'
                    : '<span class="status-expired">已过期</span>';
                var disabled = s.status !== 'pending';
                var btnHtml = disabled
                    ? (s.status === 'copied' ? '<button class="copy-btn copied" disabled>已复制</button>' : '<button class="copy-btn" disabled>已过期</button>')
                    : '<button class="copy-btn" onclick="copyCode(\'' + s.id + '\')">复制</button>';

                html += '<div class="share-item">';
                html += '<div><div class="share-code">' + escapeHtml(s.code) + '</div>';
                html += '<div class="share-meta">' + statusHtml + ' | ' + timeStr + '</div></div>';
                html += btnHtml;
                html += '</div>';
            });
            html += '</div>';
            sharesList.innerHTML = html;
        }

        function publish() {
            var code = shareInput.value.trim();
            if (!code) { showToast('请输入分享码', 'error'); return; }
            if (code.length < 2) { showToast('分享码太短', 'error'); return; }

            publishBtn.disabled = true;
            publishBtn.textContent = '发布中...';

            sharesRef.push({
                code: code,
                status: 'pending',
                createdAt: Date.now(),
                expiresAt: Date.now() + 86400000
            }).then(function() {
                shareInput.value = '';
                showToast('发布成功！');
            }).catch(function(err) {
                showToast('发布失败: ' + err.message, 'error');
            }).finally(function() {
                publishBtn.disabled = false;
                publishBtn.textContent = '发布';
            });
        }

        function copyCode(id) {
            var share = allShares.find(function(s) { return s.id === id; });
            if (!share || share.status !== 'pending') return;
            navigator.clipboard.writeText(share.code).then(function() {
                db.ref('shares/' + id).update({ status: 'copied' });
                showToast('已复制到剪贴板！');
            }).catch(function(err) {
                showToast('复制失败: ' + err.message, 'error');
            });
        }

        function showToast(msg, type) {
            toastMsg.textContent = msg;
            toast.className = 'toast' + (type === 'error' ? ' error' : '');
            setTimeout(function() { toast.classList.add('show'); }, 10);
            setTimeout(function() { toast.classList.remove('show'); }, 3000);
        }

        function escapeHtml(text) {
            var d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        publishBtn.addEventListener('click', publish);
        shareInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') publish(); });

        window.copyCode = copyCode;
        setInterval(checkExpired, 60000);
    </script>
</body>
</html>
