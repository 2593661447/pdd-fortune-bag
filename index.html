<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼多多福袋分享平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff3b30;
            --primary-dark: #e62e24;
            --secondary: #ff9500;
            --secondary-dark: #e68500;
            --success: #34c759;
            --success-dark: #2db84d;
            --warning: #ff9500;
            --danger: #ff3b30;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --text-tertiary: #a1a1a6;
            --surface-primary: #ffffff;
            --surface-secondary: #f5f5f7;
            --surface-tertiary: #e5e5ea;
            --border: #d1d1d6;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #f5f5f7;
                --text-secondary: #a1a1a6;
                --text-tertiary: #6e6e73;
                --surface-primary: #1d1d1f;
                --surface-secondary: #2c2c2e;
                --surface-tertiary: #3a3a3c;
                --border: #48484a;
                --shadow: 0 4px 20px rgba(0,0,0,0.3);
                --shadow-hover: 0 8px 30px rgba(0,0,0,0.4);
            }
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff9f0 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); }
        }
        .container { max-width:1200px; margin:0 auto; padding:var(--spacing-lg); }
        .header { text-align:center; margin-bottom:var(--spacing-2xl); padding-top:var(--spacing-xl); }
        .logo { display:flex; align-items:center; justify-content:center; gap:var(--spacing-sm); margin-bottom:var(--spacing-md); }
        .logo-icon { color:var(--primary); font-size:2.5rem; }
        .logo-text {
            font-size:2.5rem; font-weight:700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .tagline { color:var(--text-secondary); font-size:1.1rem; max-width:600px; margin:0 auto; }

        .stats-container {
            display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
            gap:var(--spacing-md); margin-bottom:var(--spacing-2xl);
        }
        .stat-card {
            background:var(--surface-primary); border-radius:var(--radius-lg);
            padding:var(--spacing-lg); box-shadow:var(--shadow);
            border:1px solid var(--border); text-align:center;
            transition:transform 0.2s ease;
        }
        .stat-card:hover { transform:translateY(-2px); }
        .stat-card.publish { border-top:4px solid var(--primary); }
        .stat-card.used-today { border-top:4px solid var(--warning); }
        .stat-card.used-total { border-top:4px solid var(--success); }
        .stat-value { font-size:2.5rem; font-weight:700; line-height:1.2; }
        .stat-label { color:var(--text-secondary); font-size:0.9rem; margin-top:var(--spacing-xs); }

        .publish-section, .shares-section, .used-section {
            background:var(--surface-primary); border-radius:var(--radius-lg);
            padding:var(--spacing-xl); box-shadow:var(--shadow);
            margin-bottom:var(--spacing-2xl); border:1px solid var(--border);
        }
        .section-title { font-size:1.5rem; font-weight:600; margin-bottom:var(--spacing-lg); display:flex; align-items:center; gap:var(--spacing-sm); }
        .section-title i { color:var(--primary); }
        .section-title .refresh-btn {
            margin-left:auto; padding:var(--spacing-sm) var(--spacing-md);
            background:var(--surface-secondary); color:var(--text-secondary);
            border:1px solid var(--border); border-radius:var(--radius-sm);
            cursor:pointer; font-size:0.9rem; transition:all 0.2s ease;
            display:flex; align-items:center; gap:var(--spacing-xs);
        }
        .section-title .refresh-btn:hover { background:var(--surface-tertiary); color:var(--text-primary); }
        .section-title .refresh-btn:active { transform:scale(0.95); }
        .section-title .refresh-btn.spinning i { animation:spin 0.6s ease-in-out; }
        @keyframes spin { to { transform:rotate(360deg); } }

        .input-group { display:flex; gap:var(--spacing-md); margin-bottom:var(--spacing-md); }
        @media (max-width:768px) { .input-group { flex-direction:column; } }
        .share-input {
            flex:1; padding:var(--spacing-lg); border:2px solid var(--border);
            border-radius:var(--radius-md); font-size:1.1rem; letter-spacing:2px;
            background:var(--surface-primary); color:var(--text-primary);
            transition:all 0.2s ease;
        }
        .share-input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(255,59,48,0.1); }
        .share-input::placeholder { color:var(--text-tertiary); letter-spacing:0; }
        .share-input.invalid { border-color:var(--danger); }
        .publish-btn {
            padding:var(--spacing-lg) var(--spacing-xl);
            background:var(--primary); color:white; border:none; border-radius:var(--radius-md);
            font-size:1.1rem; font-weight:600; cursor:pointer;
            transition:all 0.2s ease; white-space:nowrap;
        }
        .publish-btn:hover:not(:disabled) { background:var(--primary-dark); transform:translateY(-2px); box-shadow:0 6px 20px rgba(255,59,48,0.3); }
        .publish-btn:disabled { opacity:0.6; cursor:not-allowed; }
        .hint { color:var(--text-secondary); font-size:0.9rem; }

        .shares-list { display:grid; gap:var(--spacing-md); }
        .share-item {
            background:var(--surface-secondary); border-radius:var(--radius-md);
            padding:var(--spacing-lg); border:1px solid var(--border);
            display:flex; justify-content:space-between; align-items:center; gap:var(--spacing-md);
        }
        @media (max-width:768px) { .share-item { flex-direction:column; align-items:flex-start; } }
        .share-code { font-family:'Courier New', monospace; font-size:1.3rem; font-weight:600; word-break:break-all; }
        .share-meta { color:var(--text-secondary); font-size:0.9rem; margin-top:var(--spacing-xs); }
        .status-pending { color:var(--warning); font-weight:500; }
        .status-copied { color:var(--success); font-weight:500; }
        .status-expired { color:var(--text-tertiary); font-weight:500; }

        .share-actions { display:flex; gap:var(--spacing-sm); flex-shrink:0; }
        @media (max-width:768px) { .share-actions { align-self:stretch; } }

        .copy-btn {
            padding:var(--spacing-md) var(--spacing-lg);
            background:var(--secondary); color:white; border:none; border-radius:var(--radius-sm);
            font-weight:600; cursor:pointer; white-space:nowrap;
            transition:all 0.2s ease;
        }
        .copy-btn:hover:not(:disabled) { background:var(--secondary-dark); transform:translateY(-2px); }
        .copy-btn:disabled { background:var(--surface-tertiary); color:var(--text-tertiary); cursor:not-allowed; }
        .copy-btn.copied { background:var(--success); }

        .smart-btn {
            padding:var(--spacing-md) var(--spacing-lg);
            background:var(--success); color:white; border:none; border-radius:var(--radius-sm);
            font-weight:600; cursor:pointer; white-space:nowrap;
            transition:all 0.2s ease; position:relative; overflow:hidden;
        }
        .smart-btn:hover:not(:disabled) { background:var(--success-dark); transform:translateY(-2px); box-shadow:0 4px 15px rgba(52,199,89,0.4); }
        .smart-btn:active:not(:disabled) { transform:scale(0.95); }
        .smart-btn:disabled { background:var(--surface-tertiary); color:var(--text-tertiary); cursor:not-allowed; }
        .smart-btn::after {
            content:''; position:absolute; top:50%; left:50%; width:0; height:0;
            border-radius:50%; background:rgba(255,255,255,0.3);
            transform:translate(-50%, -50%); transition:width 0.6s, height 0.6s;
        }
        .smart-btn:active::after { width:300px; height:300px; }

        .empty-state { text-align:center; padding:var(--spacing-2xl); color:var(--text-tertiary); }
        .empty-state i { font-size:4rem; margin-bottom:var(--spacing-lg); opacity:0.5; }

        .used-list { display:grid; gap:var(--spacing-sm); }
        .used-item {
            background:var(--surface-secondary); border-radius:var(--radius-sm);
            padding:var(--spacing-md); border:1px solid var(--border);
            display:flex; justify-content:space-between; align-items:center;
        }
        .used-code { font-family:'Courier New', monospace; font-weight:600; }
        .used-time { color:var(--text-secondary); font-size:0.85rem; }

        .footer { text-align:center; margin-top:var(--spacing-2xl); padding:var(--spacing-xl) 0; color:var(--text-secondary); font-size:0.9rem; border-top:1px solid var(--border); }
        .connection-bar {
            text-align:center; padding:var(--spacing-md); border-radius:var(--radius-md);
            margin-bottom:var(--spacing-lg); font-weight:500;
        }
        .connection-ok { background:rgba(52,199,89,0.1); color:var(--success); }
        .connection-err { background:rgba(255,59,48,0.1); color:var(--danger); }
        .toast {
            position:fixed; bottom:var(--spacing-xl); right:var(--spacing-xl);
            background:var(--surface-primary); padding:var(--spacing-lg) var(--spacing-xl);
            border-radius:var(--radius-md); box-shadow:var(--shadow-hover);
            border-left:4px solid var(--success); z-index:1000; max-width:400px;
            transition:all 0.3s ease; opacity:0; transform:translateY(100px);
        }
        .toast.show { opacity:1; transform:translateY(0); }
        .toast.error { border-left-color:var(--danger); }
        @media (max-width:768px) { .toast { left:var(--spacing-md); right:var(--spacing-md); max-width:none; } }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-gift logo-icon"></i>
                <h1 class="logo-text">拼多多福袋分享</h1>
            </div>
            <p class="tagline">分享你的福袋，每个分享码仅限一人复制，24小时内有效</p>
        </header>

        <div class="connection-bar connection-err" id="connBar">连接中...</div>

        <div class="stats-container">
            <div class="stat-card publish">
                <div class="stat-value" id="publishedCount">0</div>
                <div class="stat-label">今日发布分享码</div>
            </div>
            <div class="stat-card used-today">
                <div class="stat-value" id="usedTodayCount">0</div>
                <div class="stat-label">今日已使用</div>
            </div>
            <div class="stat-card used-total">
                <div class="stat-value" id="usedTotalCount">0</div>
                <div class="stat-label">总计已使用</div>
            </div>
        </div>

        <section class="publish-section">
            <h2 class="section-title"><i class="fas fa-plus-circle"></i>发布新分享码</h2>
            <div class="input-group">
                <input type="text" class="share-input" id="shareInput" placeholder="输入9位数字分享码" maxlength="9" inputmode="numeric" pattern="\d{9}">
                <button class="publish-btn" id="publishBtn">发布</button>
            </div>
            <p class="hint">分享码必须是9位数字，发布后24小时内有效，仅限一人复制</p>
        </section>

        <section class="shares-section">
            <h2 class="section-title">
                <i class="fas fa-list"></i>当前分享码列表
                <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </h2>
            <div id="sharesList">
                <div class="empty-state"><i class="fas fa-inbox"></i><p>暂无分享码</p></div>
            </div>
        </section>

        <section class="used-section">
            <h2 class="section-title">
                <i class="fas fa-check-circle"></i>今日已使用的码
                <button class="refresh-btn" id="refreshUsedBtn" onclick="manualRefresh()">
                    <i class="fas fa-sync-alt"></i> 刷新
                </button>
            </h2>
            <div id="usedList">
                <div class="empty-state"><i class="fas fa-inbox"></i><p>今日暂无已使用的码</p></div>
            </div>
        </section>

        <footer class="footer">
            <p>拼多多福袋分享平台 | 实时同步，多人共享 | 2025</p>
        </footer>
    </div>

    <div class="toast" id="toast"><span id="toastMsg"></span></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCWVH_Bt_gYKFa9KqxyNRaqNtNooqOmuhk",
            authDomain: "pdd-fortune-bag.firebaseapp.com",
            databaseURL: "https://pdd-fortune-bag-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "pdd-fortune-bag",
            storageBucket: "pdd-fortune-bag.firebasestorage.app",
            messagingSenderId: "1076733344090",
            appId: "1:1076733344090:web:23ea8f1d399689dbf95b63"
        };

        const connBar = document.getElementById('connBar');
        const shareInput = document.getElementById('shareInput');
        const publishBtn = document.getElementById('publishBtn');
        const sharesList = document.getElementById('sharesList');
        const usedList = document.getElementById('usedList');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const publishedCountEl = document.getElementById('publishedCount');
        const usedTodayCountEl = document.getElementById('usedTodayCount');
        const usedTotalCountEl = document.getElementById('usedTotalCount');

        let allShares = [];

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const sharesRef = db.ref('shares');

        db.ref('.info/connected').on('value', function(snap) {
            if (snap.val() === true) {
                connBar.className = 'connection-bar connection-ok';
                connBar.textContent = '已连接 - 实时同步中';
            } else {
                connBar.className = 'connection-bar connection-err';
                connBar.textContent = '连接断开，正在重连...';
            }
        });

        sharesRef.on('value', function(snapshot) {
            const data = snapshot.val();
            allShares = data ? Object.entries(data).map(function(e) {
                return { id: e[0], code: e[1].code, status: e[1].status, createdAt: e[1].createdAt, expiresAt: e[1].expiresAt };
            }) : [];
            checkExpired();
            renderShares();
            renderUsed();
            updateStats();
        });

        function checkExpired() {
            const now = Date.now();
            var updates = {};
            allShares.forEach(function(s) {
                if (s.status === 'pending' && s.expiresAt <= now) {
                    updates[s.id + '/status'] = 'expired';
                }
            });
            if (Object.keys(updates).length > 0) db.ref('shares').update(updates);
        }

        function renderShares() {
            var today = new Date().toISOString().split('T')[0];
            var todayShares = allShares.filter(function(s) {
                return new Date(s.createdAt).toISOString().split('T')[0] === today && s.status !== 'expired';
            });

            if (todayShares.length === 0) {
                sharesList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>暂无分享码</p></div>';
                return;
            }

            todayShares.sort(function(a, b) { return b.createdAt - a.createdAt; });

            var html = '<div class="shares-list">';
            todayShares.forEach(function(s) {
                var timeLeft = s.expiresAt - Date.now();
                var h = Math.floor(timeLeft / 3600000);
                var m = Math.floor((timeLeft % 3600000) / 60000);
                var timeStr = timeLeft > 0 ? h + 'h' + m + 'm后过期' : '已过期';
                var statusHtml = s.status === 'pending' ? '<span class="status-pending">待复制</span>'
                    : s.status === 'copied' ? '<span class="status-copied">已复制</span>'
                    : '<span class="status-expired">已过期</span>';
                var disabled = s.status !== 'pending';

                html += '<div class="share-item">';
                html += '<div><div class="share-code">' + s.code + '</div>';
                html += '<div class="share-meta">' + statusHtml + ' | ' + timeStr + '</div></div>';
                html += '<div class="share-actions">';
                if (disabled) {
                    html += '<button class="smart-btn" disabled>智能直达</button>';
                    html += '<button class="copy-btn copied" disabled>已复制</button>';
                } else {
                    html += '<button class="smart-btn" onclick="smartCopy(\'' + s.id + '\')">智能直达</button>';
                    html += '<button class="copy-btn" onclick="copyCode(\'' + s.id + '\')">复制</button>';
                }
                html += '</div></div>';
            });
            html += '</div>';
            sharesList.innerHTML = html;
        }

        function renderUsed() {
            var today = new Date().toISOString().split('T')[0];
            var todayUsed = allShares.filter(function(s) {
                return new Date(s.createdAt).toISOString().split('T')[0] === today && s.status === 'copied';
            });

            if (todayUsed.length === 0) {
                usedList.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>今日暂无已使用的码</p></div>';
                return;
            }

            todayUsed.sort(function(a, b) { return b.createdAt - a.createdAt; });

            var html = '<div class="used-list">';
            todayUsed.forEach(function(s) {
                var t = new Date(s.createdAt);
                var timeStr = t.toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' });
                html += '<div class="used-item">';
                html += '<span class="used-code">' + s.code + '</span>';
                html += '<span class="used-time">' + timeStr + '</span>';
                html += '</div>';
            });
            html += '</div>';
            usedList.innerHTML = html;
        }

        function updateStats() {
            var today = new Date().toISOString().split('T')[0];
            var todayShares = allShares.filter(function(s) {
                return new Date(s.createdAt).toISOString().split('T')[0] === today;
            });
            publishedCountEl.textContent = todayShares.length;
            usedTodayCountEl.textContent = todayShares.filter(function(s) { return s.status === 'copied'; }).length;
            usedTotalCountEl.textContent = allShares.filter(function(s) { return s.status === 'copied'; }).length;
        }

        function isValidCode(code) {
            return /^\d{9}$/.test(code);
        }

        shareInput.addEventListener('input', function() {
            var val = this.value;
            if (val.length > 0 && !/^\d*$/.test(val)) {
                this.value = val.replace(/\D/g, '');
            }
            if (this.value.length > 0 && !isValidCode(this.value)) {
                this.classList.add('invalid');
            } else {
                this.classList.remove('invalid');
            }
        });

        function publish() {
            var code = shareInput.value.trim();
            if (!code) { showToast('请输入分享码', 'error'); return; }
            if (!isValidCode(code)) {
                showToast('分享码不规范', 'error');
                shareInput.classList.add('invalid');
                shareInput.focus();
                return;
            }
            shareInput.classList.remove('invalid');
            publishBtn.disabled = true;
            publishBtn.textContent = '发布中...';

            sharesRef.push({
                code: code,
                status: 'pending',
                createdAt: Date.now(),
                expiresAt: Date.now() + 86400000
            }).then(function() {
                shareInput.value = '';
                showToast('发布成功！');
            }).catch(function(err) {
                showToast('发布失败: ' + err.message, 'error');
            }).finally(function() {
                publishBtn.disabled = false;
                publishBtn.textContent = '发布';
            });
        }

        function copyCode(id) {
            var share = allShares.find(function(s) { return s.id === id; });
            if (!share || share.status !== 'pending') return;
            navigator.clipboard.writeText(share.code).then(function() {
                db.ref('shares/' + id).update({ status: 'copied' });
                showToast('已复制到剪贴板！');
            }).catch(function(err) {
                showToast('复制失败: ' + err.message, 'error');
            });
        }

        function smartCopy(id) {
            var share = allShares.find(function(s) { return s.id === id; });
            if (!share || share.status !== 'pending') return;
            navigator.clipboard.writeText(share.code).then(function() {
                db.ref('shares/' + id).update({ status: 'copied' });
                showToast('智能直达：已复制 ' + share.code + ' 到剪贴板！');
            }).catch(function(err) {
                showToast('复制失败: ' + err.message, 'error');
            });
        }

        function manualRefresh() {
            var btns = document.querySelectorAll('.refresh-btn');
            btns.forEach(function(b) { b.classList.add('spinning'); });
            setTimeout(function() {
                btns.forEach(function(b) { b.classList.remove('spinning'); });
            }, 600);
            showToast('已刷新');
        }

        function showToast(msg, type) {
            toastMsg.textContent = msg;
            toast.className = 'toast' + (type === 'error' ? ' error' : '');
            setTimeout(function() { toast.classList.add('show'); }, 10);
            setTimeout(function() { toast.classList.remove('show'); }, 3000);
        }

        publishBtn.addEventListener('click', publish);
        shareInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') publish(); });

        window.copyCode = copyCode;
        window.smartCopy = smartCopy;
        window.manualRefresh = manualRefresh;
        setInterval(checkExpired, 60000);
    </script>
</body>
</html>
